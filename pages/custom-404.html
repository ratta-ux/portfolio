<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Ratta Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0e1621;
            --secondary: #0ea5e9;
            --accent: #38bdf8;
            --light: #f0f9ff;
            --dark: #0f172a;
            --text: #e2e8f0;
            --gray: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--primary);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
        }

        .error-container {
            max-width: 600px;
            padding: 2rem;
        }

        .error-code {
            font-size: 9rem;
            font-weight: 700;
            color: var(--secondary);
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .error-message {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: var(--light);
        }

        .error-description {
            color: var(--gray);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.3);
        }

        .btn-outline {
            border: 1px solid var(--gray);
            color: var(--light);
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        .quick-links {
            margin-top: 3rem;
        }

        .quick-links h3 {
            margin-bottom: 1rem;
            color: var(--light);
            font-size: 1.2rem;
        }

        .quick-links ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
        }

        .quick-links a {
            color: var(--gray);
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: color 0.3s ease;
        }

        .quick-links a:hover {
            color: var(--secondary);
        }

        .quick-links a i {
            margin-right: 0.5rem;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-message {
                font-size: 1.5rem;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Page Not Found</h2>
        <p class="error-description">Sorry, the page you're looking for doesn't exist or has been moved. Please check the URL or use the navigation below to find what you're looking for.</p>
        
        <div class="buttons">
            <a href="index.html" class="btn btn-primary">Back to Homepage</a>
            <a href="javascript:history.back()" class="btn btn-outline">Go Back</a>
        </div>
        
        <div class="quick-links">
            <h3>Quick Links</h3>
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="makro-pro.html"><i class="fas fa-shopping-cart"></i> Makro Pro Case Study</a></li>
                <li><a href="aia-health.html"><i class="fas fa-heartbeat"></i> AIA Health Case Study</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
